name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain

# Koşucu imajı sabit: ubuntu-latest Ekim 2026'da Ubuntu 26'ya geçiyor; Android SDK içeriği değişirse
# CI kod değişmeden kırılmasın. Yükseltme bilinçli bir commit'le yapılır.

jobs:
  build:
    name: Derle ve test et
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # Room şemasını depoya geri yazmak için
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Döngü motoru testleri
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:cycle:test --no-daemon --stacktrace 2>&1 | tee build-core.log

      - name: Uygulama birim testleri ve debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-app.log

      # Günlükler ajan oturumlarından indirilemiyor; derleme hataları ve test özeti
      # GitHub "annotation" olarak yayımlanır (gh run view / check-runs API ile okunur).
      - name: Derleme hatalarını açıklama olarak yayımla
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          esc() { printf '%s' "$1" | sed 's/%/%25/g; s/\r/%0D/g'; }
          n=0
          while IFS= read -r line; do
            n=$((n + 1)); [ "$n" -gt 10 ] && break
            echo "::error title=Kotlin::$(esc "$line")"
          done < <(cat build-core.log build-app.log 2>/dev/null | grep -E '^e: ' | sed 's#file:///home/runner/work/[^/]*/[^/]*/##')
          if [ "$n" -eq 0 ]; then
            cat build-core.log build-app.log 2>/dev/null | grep -A 8 'What went wrong' | head -40 | while IFS= read -r line; do
              echo "::error title=Gradle::$(esc "$line")"
            done
          fi
          cat build-core.log build-app.log 2>/dev/null | grep -E 'FAILED$|Test.*FAILED|AssertionError|Exception' | grep -v 'BUILD FAILED' | head -10 | while IFS= read -r line; do
            echo "::error title=Test::$(esc "$line")"
          done

      - name: Test ve uyarı özeti
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          total=0; failed=0; errors=0
          while IFS= read -r f; do
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*'); fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*'); er=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total + ${t:-0})); failed=$((failed + ${fl:-0})); errors=$((errors + ${er:-0}))
          done < <(find . -path '*/test-results/*' -name '*.xml')
          echo "::notice title=Testler::$total test, $failed başarısız, $errors hata"
          wc=$(cat build-core.log build-app.log 2>/dev/null | grep -c '^w: ' || true)
          echo "::notice title=Kotlin uyarıları::$wc uyarı"
          cat build-core.log build-app.log 2>/dev/null | grep '^w: ' | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -10 | while IFS= read -r line; do
            echo "::warning title=Kotlin::$(printf '%s' "$line" | sed 's/%/%25/g')"
          done

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-raporlari
          path: |
            core/cycle/build/reports/tests/test
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Room şeması
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: room-semasi
          path: app/schemas
          if-no-files-found: ignore

      - name: Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ayla-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Room şema JSON'u derlemede üretilir; migration yazabilmek için depoda durmalı.
      # Ajan oturumları derleyemediği için CI yazar (bot push'u yeni çalıştırma tetiklemez).
      - name: Room şemasını depoya yaz
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Room şemasını güncelle (CI)" -m "[skip ci]"
            git push
          else
            echo "Şema değişmedi."
          fi

  ekran:
    name: Ekran görüntüleri
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Görsel belgeler ve inceleme içindir; altyapı oturana kadar ana derlemeyi kırmızıya çevirmez.
    continue-on-error: true
    permissions:
      contents: write # ekran-goruntuleri dalına yazmak için
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ekranları çiz (Robolectric + Roborazzi)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest -Pekran --tests 'com.ayla.pcos.ekran.*' --no-daemon --stacktrace 2>&1 | tee build-ekran.log

      - name: Hataları açıklama olarak yayımla
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          grep -E '^e: ' build-ekran.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -10 | while IFS= read -r line; do
            echo "::error title=Kotlin::$(printf '%s' "$line" | sed 's/%/%25/g')"
          done
          grep -A 8 'What went wrong' build-ekran.log | head -12 | while IFS= read -r line; do
            echo "::error title=Gradle::$(printf '%s' "$line" | sed 's/%/%25/g')"
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for tag in ('failure', 'error'):
                      el = case.find(tag)
                      if el is None:
                          continue
                      text = (el.get('message') or '') + '\n' + (el.text or '')
                      lines = [l.strip() for l in text.splitlines() if l.strip()][:8]
                      msg = '%0A'.join(l.replace('%', '%25') for l in lines)
                      print(f"::error title=Ekran {case.get('name')}::{msg}")
                      n += 1
                      if n >= 6:
                          raise SystemExit(0)
          PY

      - name: Görüntü özeti
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d app/build/ekran ]; then
            n=$(ls app/build/ekran/*.png 2>/dev/null | wc -l)
            echo "::notice title=Ekran görüntüleri::$n görüntü: $(cd app/build/ekran && ls *.png | tr '\n' ' ')"
          else
            echo "::warning title=Ekran görüntüleri::görüntü üretilmedi"
          fi

      - name: ekran-goruntuleri dalına yükle
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          src="$PWD/app/build/ekran"
          dir="$(mktemp -d)"
          cp "$src"/*.png "$dir"/
          cd "$dir"
          {
            echo "# Ayla ekran görüntüleri"
            echo
            echo "Kaynak commit: ${GITHUB_SHA::7} · CI tarafından üretilir, elle düzenlenmez."
            echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "![${f%.png}]($f)"; echo; done
          } > README.md
          git init -q -b ekran-goruntuleri
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Ekran görüntüleri (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ekran-goruntuleri
          echo "::notice title=Ekran görüntüleri::ekran-goruntuleri dalına yüklendi"

      - name: Ekran görüntüleri artefaktı
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ekran-goruntuleri
          path: app/build/ekran
          if-no-files-found: ignore

  release-check:
    name: Sürüm derlemesi (R8) ve lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: İmzasız release (R8 + kaynak küçültme)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log

      - name: R8 hatalarını açıklama olarak yayımla
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          grep -E 'ERROR|Missing class|What went wrong' -A 4 build-release.log | head -40 | while IFS= read -r line; do
            echo "::error title=R8::$(printf '%s' "$line" | sed 's/%/%25/g')"
          done

      - name: İzin denetimi (birleştirilmiş manifest)
        shell: bash
        run: |
          # Gizlilik politikası "internet izni yok" der; bir kütüphane manifest birleştirmesiyle INTERNET
          # eklerse CI kırmızıya döner. İzin listesi her çalıştırmada açıklama olarak yayımlanır.
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          perms=$("$aapt2" dump permissions "$apk" | grep -oE "name='[^']+'" | sed "s/name='//; s/'//" | sort -u)
          echo "::notice title=İzinler::$(echo "$perms" | tr '\n' ' ')"
          if echo "$perms" | grep -qx 'android.permission.INTERNET'; then
            echo "::error title=İzin::INTERNET izni eklendi; gizlilik politikası ve Veri güvenliği formu buna göre güncellenmeden yayımlanamaz"
            exit 1
          fi

      - name: Lint
        continue-on-error: true
        shell: bash
        run: ./gradlew :app:lintDebug --no-daemon 2>&1 | tail -20

      - name: Lint özeti
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          f=app/build/reports/lint-results-debug.xml
          if [ -f "$f" ]; then
            e=$(grep -c 'severity="Error"' "$f" || true); w=$(grep -c 'severity="Warning"' "$f" || true)
            echo "::notice title=Lint::$e hata, $w uyarı"
            python3 - "$f" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          from collections import Counter
          counts = Counter(i.get('id') for i in root.findall('issue') if i.get('severity') == 'Warning')
          print("::notice title=Lint uyarı dağılımı::" + ", ".join(f"{k}×{v}" for k, v in counts.most_common(12)))
          # Tüm uyarılar tek açıklamada (adım başına açıklama sınırı nedeniyle): kimlik, dosya:satır, ileti
          rows = []
          for issue in root.findall('issue'):
              if issue.get('severity') != 'Warning':
                  continue
              loc = issue.find('location')
              path = (loc.get('file') or '').split('/PCOS/')[-1].split('/pcos/')[-1] if loc is not None else ''
              line = loc.get('line') if loc is not None else ''
              msg = issue.get('message', '').replace('%', '%25').replace('\n', ' ')[:160]
              rows.append(f"{issue.get('id')} {path}:{line} {msg}")
          if rows:
              print("::notice title=Lint uyarıları::" + "%0A".join(rows[:80]))
          n = 0
          for issue in root.findall('issue'):
              if issue.get('severity') != 'Error':
                  continue
              loc = issue.find('location')
              path = (loc.get('file') or '').split('/PCOS/')[-1] if loc is not None else ''
              line = loc.get('line') if loc is not None else ''
              msg = issue.get('message', '').replace('%', '%25').replace('\n', ' ')
              print(f"::warning title=Lint {issue.get('id')}::{path}:{line} {msg}")
              n += 1
              if n >= 10:
                  break
          PY
          else
            echo "::notice title=Lint::rapor üretilmedi"
          fi

      - name: Lint raporu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-raporu
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
